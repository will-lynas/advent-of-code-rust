[package]
name = "advent-of-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "advent-of-code"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.23", features = ["derive"] }
dotenv = "0.15"
gxhash = "3.4.1"
itertools = "0.13.0"
md-5 = "0.10.6"
num = "0.4.3"
regex = "1.11.1"
reqwest = "0.12"
tokio = { version = "1.47.0", features = ["full"] }

[dev-dependencies]
indoc = "2.0.5"
criterion = { version = "0.5", features = ["html_reports"] }
paste = "1.0"

[[bin]]
name = "advent-of-code"
path = "src/main.rs"

[[bench]]
name = "benchmarks"
harness = false
